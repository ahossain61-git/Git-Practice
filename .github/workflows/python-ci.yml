



name: Python Calculator CI

on:
  push:
    branches:
      - main
      - fix-failing-test
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Python version
        run: python --version

      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          python -m py_compile calculator.py
          python -m py_compile calculator_gui.py

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run automated tests
        run: python -m pytest test_calculator.py -v

      - name: CI completed
        run: echo "Python tests passed!"
